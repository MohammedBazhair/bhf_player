name: bhf_player
description: "مشغل فيديو لفك تشفير ملفات الفيديو المشفرة"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.3+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  device_info_plus: ^12.3.0
  crypto: ^3.0.7
  encrypt: ^5.0.3
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  path: ^1.9.1
  permission_handler: ^12.0.0+1
  rename: ^3.1.0
  sqflite_common_ffi: ^2.4.0+2
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  get_it: ^9.2.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.6 # Native video dependencies.
  flashy_flushbar: ^1.4.0
  sqflite: ^2.4.2
  flutter_svg: ^2.2.4
  pool: ^1.5.1
  equatable: ^2.0.8
  screen_brightness: ^2.1.7
  volume_controller: ^3.4.3
  flutter_native_splash: ^2.4.7
  flutter_screenutil: ^5.9.3
  intl: ^0.20.2
  video_thumbnail: ^0.5.6
  flutter_video_info: ^1.3.3
  pretty_qr_code: ^3.6.0
  mobile_scanner: ^7.2.0
  scanner_overlay: ^0.0.2
  safe_device: ^1.3.8
  clarity_flutter: ^1.7.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.13.1
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  intl_utils: ^2.8.14

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
flutter_intl:
  enabled: true
